<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crate — Save & Organize Videos You Love</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --accent: #6c5ce7;
    --accent-hover: #7d6bf0;
    --text: #f0f0f5;
    --muted: #9a9ba5;
    --error: #ff6b6b;
    --success: #51cf66;
    --border: #2a2d38;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px; }

  h1 { font-size: 24px; margin: 10px 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }

  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    padding: 10px 4px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-right: 16px;
  }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }

  input[type="text"], select, textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #0f1115;
    color: var(--text);
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }
  input[type="text"]:focus, select:focus, textarea:focus { border-color: var(--accent); }
  label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 6px; }
  label:first-child { margin-top: 0; }

  button.primary {
    width: 100%;
    margin-top: 18px;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }

  #saveStatus { margin-top: 14px; font-size: 13px; min-height: 18px; }
  #saveStatus.error { color: var(--error); }
  #saveStatus.success { color: var(--success); }

  .preview-box {
    display: none;
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .preview-box.show { display: block; }
  .preview-head { display: flex; gap: 12px; margin-bottom: 4px; }
  .preview-head img { width: 90px; height: 90px; object-fit: cover; border-radius: 8px; background: #0f1115; }
  .preview-head .meta { flex: 1; min-width: 0; }
  .preview-head .meta .platform { font-size: 11px; color: var(--accent); font-weight: 700; text-transform: uppercase; }
  .preview-head .meta .orig-title { font-size: 12px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

  /* Genre filter pills in Library tab */
  /* Play All / Shuffle / Autoplay / Subtitles controls */
  .queue-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 14px;
  }
  .queue-bar button.play-all {
    padding: 8px 14px;
    border-radius: 20px;
    border: 1px solid var(--accent);
    background: rgba(108,92,231,0.15);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .toggle-pill {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 7px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    user-select: none;
  }
  .toggle-pill.on { border-color: var(--success); color: var(--text); background: rgba(81,207,102,0.12); }
  .toggle-pill input { display: none; }
  .queue-hint { font-size: 11px; color: var(--muted); margin: -6px 0 14px; }

  .genre-scroll {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 10px;
    margin-bottom: 16px;
  }
  .genre-pill {
    flex-shrink: 0;
    padding: 8px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .genre-pill.active { border-color: var(--accent); color: var(--text); background: rgba(108,92,231,0.15); }

  .bookmark-list { display: flex; flex-direction: column; gap: 12px; }
  .bookmark-card {
    background: var(--card);
    border-radius: 12px;
    padding: 14px;
  }
  .bookmark-card-top { display: flex; gap: 12px; }
  .bookmark-card img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; flex-shrink: 0; background: #0f1115; }
  .bookmark-card .info { flex: 1; min-width: 0; }
  .bookmark-card .title { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .bookmark-card .genre-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    color: var(--accent);
    background: rgba(108,92,231,0.15);
    padding: 2px 8px;
    border-radius: 10px;
    margin-bottom: 4px;
  }
  .bookmark-card .platform-tag { font-size: 11px; color: var(--muted); }
  .bookmark-card .actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .bookmark-card .actions a, .bookmark-card .actions button {
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #0f1115;
    color: var(--text);
    text-decoration: none;
    cursor: pointer;
  }
  .bookmark-card .actions .go-original { color: var(--accent); border-color: var(--accent); }
  .bookmark-card .actions .play-btn { color: var(--success); border-color: var(--success); }

  .empty-state { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 14px; }

  /* --- Mini (draggable floating) player — the ONLY playback surface --- */
  #miniPlayer {
    display: none;
    position: fixed;
    width: 160px;
    aspect-ratio: 9 / 16;
    right: 16px;
    bottom: 90px;
    z-index: 200;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }
  #miniPlayer.show { display: flex; }
  #miniPlayer .mp-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 8px;
    background: #171a21;
    flex-shrink: 0;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #miniPlayer .mp-head.armed { background: var(--accent); }
  #miniPlayer .mp-head .mp-hint {
    font-size: 10px;
    color: var(--muted);
  }
  #miniPlayer .mp-head.armed .mp-hint { color: white; }
  #miniPlayer .mp-head button {
    width: 22px; height: 22px;
    border-radius: 5px;
    border: none;
    background: #23252e;
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #miniPlayer .mp-btns { display: flex; gap: 4px; }
  #miniPlayer .mp-body { flex: 1; min-height: 0; }
  #miniPlayer .mp-body iframe { width: 100%; height: 100%; border: none; }

  /* --- Fullscreen player --- */
  #fullscreenPlayer {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    z-index: 300;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 20px;
  }
  #fullscreenPlayer.show { display: flex; }
  #fullscreenPlayer .fs-body {
    width: 100%;
    max-width: 400px;
    aspect-ratio: 9 / 16;
    max-height: 78vh;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
  }
  #fullscreenPlayer .fs-body iframe { width: 100%; height: 100%; border: none; }
  #fullscreenPlayer .fs-controls { display: flex; gap: 10px; margin-top: 16px; }
  #fullscreenPlayer button {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎧 Crate</h1>
  <p class="sub">Save the videos and sounds you love — organized, findable, never lost in your bookmarks again.</p>

  <div class="tabs">
    <button class="tab-btn active" data-tab="save">Save</button>
    <button class="tab-btn" data-tab="library">Library</button>
  </div>

  <div class="tab-panel active" id="tab-save">
    <div class="card">
      <label>Paste a video link</label>
      <input type="text" id="urlInput" placeholder="https://www.tiktok.com/@user/video/...">
      <button class="primary" id="fetchBtn">Fetch details</button>
      <div id="saveStatus"></div>

      <div class="preview-box" id="previewBox">
        <div class="preview-head">
          <img id="pvThumb" src="" alt="">
          <div class="meta">
            <div class="platform" id="pvPlatform"></div>
            <div class="orig-title" id="pvOrigTitle"></div>
          </div>
        </div>

        <label>Give it your own title</label>
        <input type="text" id="pvTitle" placeholder="e.g. That Tungba drum cover">

        <label>Genre</label>
        <select id="pvGenre"></select>
        <input type="text" id="pvGenreCustom" placeholder="Type your own genre..." style="display:none; margin-top:8px;">

        <label>Notes (optional)</label>
        <textarea id="pvNotes" rows="2" placeholder="Why you saved it, a timestamp, whatever's useful"></textarea>

        <button class="primary" id="confirmSaveBtn">Save to Library</button>
      </div>
    </div>
  </div>

  <div class="tab-panel" id="tab-library">
    <div class="queue-bar">
      <button class="play-all" id="playAllBtn">▶ Play All</button>
      <label class="toggle-pill" id="shuffleToggle"><input type="checkbox" id="shuffleCheck"> 🔀 Shuffle</label>
      <label class="toggle-pill" id="autoplayToggle"><input type="checkbox" id="autoplayCheck"> 🔁 Autoplay</label>
      <label class="toggle-pill" id="subtitlesToggle"><input type="checkbox" id="subtitlesCheck"> 💬 Subtitles</label>
    </div>
    <div class="queue-hint">Autoplay is exact for YouTube, approximate (timer-based) for TikTok. Subtitles only work on YouTube.</div>
    <div class="genre-scroll" id="genreScroll"></div>
    <div class="bookmark-list" id="bookmarkList"></div>
  </div>
</div>

<!-- Draggable mini player — the only place video plays -->
<div id="miniPlayer">
  <div class="mp-head" id="mpHead">
    <span class="mp-hint" id="mpHint">⠿ hold to move</span>
    <div class="mp-btns">
      <button id="mpPrev" title="Previous">⏮</button>
      <button id="mpNext" title="Next">⏭</button>
      <button id="mpFullscreen" title="Fullscreen">⤢</button>
      <button id="mpClose" title="Close">✕</button>
    </div>
  </div>
  <div class="mp-body" id="mpBody"></div>
</div>

<!-- Fullscreen player -->
<div id="fullscreenPlayer">
  <div class="fs-body" id="fsBody"></div>
  <div class="fs-controls">
    <button id="fsPrev">⏮ Prev</button>
    <button id="fsNext">Next ⏭</button>
    <button id="fsMinimize">Shrink to mini player</button>
    <button id="fsClose">Close</button>
  </div>
</div>

<script>
// --- Genre list: fetched live from the server so custom genres you've
// typed in before show up as real options/pills, not just accepted once. ---
let GENRES = [];

async function refreshGenres() {
  const res = await fetch('/api/genres');
  GENRES = await res.json();
  populateGenreSelect();
  renderGenrePills();
}

function populateGenreSelect() {
  const currentValue = pvGenre.value;
  pvGenre.innerHTML = GENRES.map(g => `<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`).join('')
    + `<option value="__custom__">+ Add new genre</option>`;
  // Preserve selection across refreshes where possible
  if (currentValue && GENRES.includes(currentValue)) pvGenre.value = currentValue;
}

// --- Tabs ---
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'library') refreshGenres().then(() => loadBookmarks(currentGenreFilter));
  });
});

// --- Save tab ---
const urlInput = document.getElementById('urlInput');
const fetchBtn = document.getElementById('fetchBtn');
const saveStatus = document.getElementById('saveStatus');
const previewBox = document.getElementById('previewBox');
const pvThumb = document.getElementById('pvThumb');
const pvPlatform = document.getElementById('pvPlatform');
const pvOrigTitle = document.getElementById('pvOrigTitle');
const pvTitle = document.getElementById('pvTitle');
const pvGenre = document.getElementById('pvGenre');
const pvGenreCustom = document.getElementById('pvGenreCustom');
const pvNotes = document.getElementById('pvNotes');
const confirmSaveBtn = document.getElementById('confirmSaveBtn');

pvGenre.addEventListener('change', () => {
  if (pvGenre.value === '__custom__') {
    pvGenreCustom.style.display = 'block';
    pvGenreCustom.value = '';
    pvGenreCustom.focus();
  } else {
    pvGenreCustom.style.display = 'none';
  }
});

function getSelectedGenre() {
  if (pvGenre.value === '__custom__') {
    return pvGenreCustom.value.trim();
  }
  return pvGenre.value;
}

let currentPreview = null;

fetchBtn.addEventListener('click', async () => {
  const url = urlInput.value.trim();
  if (!url) {
    saveStatus.className = 'error';
    saveStatus.textContent = 'Paste a link first.';
    return;
  }
  fetchBtn.disabled = true;
  saveStatus.className = '';
  saveStatus.textContent = 'Fetching details...';
  previewBox.classList.remove('show');

  try {
    const res = await fetch('/api/preview', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    });
    const data = await res.json();
    if (!res.ok) {
      saveStatus.className = 'error';
      saveStatus.textContent = data.error || 'Could not fetch this link.';
      fetchBtn.disabled = false;
      return;
    }

    currentPreview = data;
    pvThumb.src = data.thumbnail || '';
    pvPlatform.textContent = data.platform;
    pvOrigTitle.textContent = data.title;
    pvTitle.value = data.title;
    pvGenre.value = data.suggested_genre;
    pvGenreCustom.style.display = 'none';
    pvNotes.value = '';
    previewBox.classList.add('show');
    saveStatus.textContent = '';
  } catch (e) {
    saveStatus.className = 'error';
    saveStatus.textContent = 'Network error, try again.';
  }
  fetchBtn.disabled = false;
});

confirmSaveBtn.addEventListener('click', async () => {
  if (!currentPreview) return;

  const genre = getSelectedGenre();
  if (!genre) {
    saveStatus.className = 'error';
    saveStatus.textContent = 'Type a genre name first.';
    return;
  }

  confirmSaveBtn.disabled = true;

  try {
    const res = await fetch('/api/bookmarks', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        url: currentPreview.original_url,
        title: pvTitle.value.trim(),
        original_title: currentPreview.title,
        genre: genre,
        notes: pvNotes.value.trim(),
        thumbnail: currentPreview.thumbnail,
        uploader: currentPreview.uploader,
        video_id: currentPreview.video_id,
        duration: currentPreview.duration,
      })
    });
    const data = await res.json();
    if (!res.ok) {
      saveStatus.className = 'error';
      saveStatus.textContent = data.error || 'Could not save.';
      confirmSaveBtn.disabled = false;
      return;
    }
    saveStatus.className = 'success';
    saveStatus.textContent = 'Saved to your library!';
    previewBox.classList.remove('show');
    urlInput.value = '';
    currentPreview = null;
    refreshGenres(); // pick up a newly typed custom genre right away
  } catch (e) {
    saveStatus.className = 'error';
    saveStatus.textContent = 'Network error, try again.';
  }
  confirmSaveBtn.disabled = false;
});

// --- Library tab ---
let currentGenreFilter = 'All';
let libraryItems = [];
const genreScroll = document.getElementById('genreScroll');
const bookmarkList = document.getElementById('bookmarkList');

function renderGenrePills() {
  const all = ['All', ...GENRES];
  genreScroll.innerHTML = all.map(g =>
    `<div class="genre-pill ${g === currentGenreFilter ? 'active' : ''}" data-genre="${g}">${g}</div>`
  ).join('');
  genreScroll.querySelectorAll('.genre-pill').forEach(pill => {
    pill.addEventListener('click', () => {
      currentGenreFilter = pill.dataset.genre;
      renderGenrePills();
      loadBookmarks(currentGenreFilter);
    });
  });
}

async function loadBookmarks(genre) {
  const q = genre && genre !== 'All' ? `?genre=${encodeURIComponent(genre)}` : '';
  const res = await fetch('/api/bookmarks' + q);
  const items = await res.json();
  libraryItems = items;

  if (!items.length) {
    bookmarkList.innerHTML = '<div class="empty-state">Nothing saved here yet.</div>';
    return;
  }

  bookmarkList.innerHTML = items.map(b => `
    <div class="bookmark-card" data-id="${b.id}">
      <div class="bookmark-card-top">
        <img src="${b.thumbnail || ''}" alt="">
        <div class="info">
          <div class="genre-badge">${b.genre}</div>
          <div class="title">${escapeHtml(b.title)}</div>
          <div class="platform-tag">${b.platform}${b.uploader ? ' · ' + escapeHtml(b.uploader) : ''}</div>
          <div class="actions">
            ${b.embed_url ? `<button class="play-btn" data-id="${b.id}">▶ Play</button>` : ''}
            <a class="go-original" href="${b.url}" target="_blank" rel="noopener">Go to original</a>
            <button class="delete-btn" data-id="${b.id}">Delete</button>
          </div>
        </div>
      </div>
    </div>
  `).join('');

  bookmarkList.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      await fetch('/api/bookmarks/' + btn.dataset.id, { method: 'DELETE' });
      loadBookmarks(currentGenreFilter);
    });
  });

  bookmarkList.querySelectorAll('.play-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      startQueue(items.filter(b => b.embed_url), btn.dataset.id);
    });
  });
}

document.getElementById('playAllBtn').addEventListener('click', () => {
  if (!libraryItems.length) return;
  const playable = libraryItems.filter(b => b.embed_url);
  if (!playable.length) return;
  startQueue(playable, playable[0].id);
});

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ============================================================
// Player: two view states — mini (draggable floating, default) and
// fullscreen — driven by a queue. Tapping Play (or Play All) builds
// a queue from whatever's currently listed in the Library tab and
// starts playing from that point.
// ============================================================

let playQueue = [];       // array of bookmark objects, in play order
let queueIndex = -1;      // position within playQueue
let currentState = null;  // 'mini' | 'fullscreen'
let ytPlayer = null;      // active YT.Player instance, when current item is YouTube
let ytApiReady = false;
let pendingYTCallback = null;
let tiktokAutoplayTimer = null; // duration-based timer for TikTok auto-advance

// Persisted toggle state
let shuffleOn = localStorage.getItem('crate_shuffle') === '1';
let autoplayOn = localStorage.getItem('crate_autoplay') === '1';
let subtitlesOn = localStorage.getItem('crate_subtitles') === '1';

const miniPlayer = document.getElementById('miniPlayer');
const mpBody = document.getElementById('mpBody');
const mpHead = document.getElementById('mpHead');
const mpHint = document.getElementById('mpHint');
const fullscreenPlayer = document.getElementById('fullscreenPlayer');
const fsBody = document.getElementById('fsBody');

const shuffleCheck = document.getElementById('shuffleCheck');
const autoplayCheck = document.getElementById('autoplayCheck');
const subtitlesCheck = document.getElementById('subtitlesCheck');
const shuffleToggle = document.getElementById('shuffleToggle');
const autoplayToggle = document.getElementById('autoplayToggle');
const subtitlesToggle = document.getElementById('subtitlesToggle');

function syncToggleUI() {
  shuffleCheck.checked = shuffleOn;
  autoplayCheck.checked = autoplayOn;
  subtitlesCheck.checked = subtitlesOn;
  shuffleToggle.classList.toggle('on', shuffleOn);
  autoplayToggle.classList.toggle('on', autoplayOn);
  subtitlesToggle.classList.toggle('on', subtitlesOn);
}
syncToggleUI();

shuffleCheck.addEventListener('change', () => {
  shuffleOn = shuffleCheck.checked;
  localStorage.setItem('crate_shuffle', shuffleOn ? '1' : '0');
  syncToggleUI();
});
autoplayCheck.addEventListener('change', () => {
  autoplayOn = autoplayCheck.checked;
  localStorage.setItem('crate_autoplay', autoplayOn ? '1' : '0');
  syncToggleUI();
  armTiktokAutoplayTimer(); // re-evaluate for the currently playing item
});
subtitlesCheck.addEventListener('change', () => {
  subtitlesOn = subtitlesCheck.checked;
  localStorage.setItem('crate_subtitles', subtitlesOn ? '1' : '0');
  syncToggleUI();
  // Reload the current item so the caption setting actually takes effect
  if (queueIndex >= 0) loadQueueItem(queueIndex, currentState);
});

// --- YouTube IFrame API (only loaded/used for YouTube items) ---
window.onYouTubeIframeAPIReady = function () {
  ytApiReady = true;
  if (pendingYTCallback) { pendingYTCallback(); pendingYTCallback = null; }
};
(function loadYouTubeApi() {
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
})();

function clearActivePlayers() {
  if (ytPlayer) {
    try { ytPlayer.destroy(); } catch (e) {}
    ytPlayer = null;
  }
  if (tiktokAutoplayTimer) {
    clearTimeout(tiktokAutoplayTimer);
    tiktokAutoplayTimer = null;
  }
  mpBody.innerHTML = '';
  fsBody.innerHTML = '';
}

function stopAllPlayers() {
  clearActivePlayers();
  miniPlayer.classList.remove('show');
  fullscreenPlayer.classList.remove('show');
}

function makeIframe(embedUrl) {
  const iframe = document.createElement('iframe');
  iframe.src = embedUrl;
  iframe.allow = 'autoplay; encrypted-media; picture-in-picture';
  iframe.allowFullscreen = true;
  return iframe;
}

// Default, safe corner position — used whenever a fresh video is opened,
// so a previous bad drag position can never persist and strand the widget.
function resetMiniPosition() {
  miniPlayer.style.left = 'auto';
  miniPlayer.style.top = 'auto';
  miniPlayer.style.right = '16px';
  miniPlayer.style.bottom = '90px';
}

// Warm up the connection to whatever platform the NEXT item needs, so
// hitting Next feels snappier. This is the extent of "preloading" that's
// realistic for embeds we don't control — we can't pre-fetch the actual
// video content itself.
function preconnectNext() {
  document.querySelectorAll('link[data-crate-preconnect]').forEach(el => el.remove());
  if (playQueue.length < 2) return;
  const nextItem = playQueue[(queueIndex + 1) % playQueue.length];
  const host = nextItem.platform === 'YouTube' ? 'https://www.youtube.com' : 'https://www.tiktok.com';
  const link = document.createElement('link');
  link.rel = 'preconnect';
  link.href = host;
  link.dataset.crateConnect = '1';
  document.head.appendChild(link);
}

function armTiktokAutoplayTimer() {
  if (tiktokAutoplayTimer) { clearTimeout(tiktokAutoplayTimer); tiktokAutoplayTimer = null; }
  if (!autoplayOn || queueIndex < 0) return;
  const item = playQueue[queueIndex];
  if (!item || item.platform === 'YouTube' || !item.duration) return;
  // +1.5s buffer for the embed's own load/buffering time before playback
  // actually starts — this is an approximation based on TikTok's own
  // reported duration, not a guess; still, actual playback timing can
  // drift slightly since we don't control TikTok's player directly.
  const ms = (item.duration + 1.5) * 1000;
  const targetIndex = queueIndex;
  tiktokAutoplayTimer = setTimeout(() => {
    if (queueIndex === targetIndex) goNext();
  }, ms);
}

function onYTStateChange(event) {
  if (event.data === YT.PlayerState.ENDED && autoplayOn) {
    goNext();
  }
}

function loadQueueItem(index, targetView) {
  if (index < 0 || index >= playQueue.length) return;
  clearActivePlayers();

  queueIndex = index;
  const item = playQueue[index];
  const view = targetView || currentState || 'mini';
  const container = view === 'fullscreen' ? fsBody : mpBody;

  if (view === 'mini') {
    resetMiniPosition();
    miniPlayer.classList.add('show');
    fullscreenPlayer.classList.remove('show');
  } else {
    fullscreenPlayer.classList.add('show');
    miniPlayer.classList.remove('show');
  }
  currentState = view;

  if (item.platform === 'YouTube' && item.video_id) {
    const buildPlayer = () => {
      const playerDiv = document.createElement('div');
      container.appendChild(playerDiv);
      ytPlayer = new YT.Player(playerDiv, {
        videoId: item.video_id,
        playerVars: {
          autoplay: 1,
          playsinline: 1,
          cc_load_policy: subtitlesOn ? 1 : 0,
          cc_lang_pref: 'en',
        },
        events: { onStateChange: onYTStateChange },
      });
    };
    if (ytApiReady) buildPlayer(); else pendingYTCallback = buildPlayer;
  } else {
    // TikTok (and anything else without a JS player API) — plain iframe.
    container.appendChild(makeIframe(item.embed_url));
    armTiktokAutoplayTimer();
  }

  preconnectNext();
}

function startQueue(items, startId) {
  if (!items.length) return;
  playQueue = items;
  const idx = Math.max(0, items.findIndex(b => b.id === startId));
  loadQueueItem(idx, 'mini');
}

function goNext() {
  if (!playQueue.length) return;
  let next;
  if (shuffleOn && playQueue.length > 1) {
    do { next = Math.floor(Math.random() * playQueue.length); } while (next === queueIndex);
  } else {
    next = (queueIndex + 1) % playQueue.length;
  }
  loadQueueItem(next, currentState);
}

function goPrev() {
  if (!playQueue.length) return;
  const prev = (queueIndex - 1 + playQueue.length) % playQueue.length;
  loadQueueItem(prev, currentState);
}

function goFullscreen() {
  if (queueIndex < 0) return;
  loadQueueItem(queueIndex, 'fullscreen');
}

function goMini() {
  if (queueIndex < 0) return;
  loadQueueItem(queueIndex, 'mini');
}

document.getElementById('mpNext').addEventListener('click', goNext);
document.getElementById('mpPrev').addEventListener('click', goPrev);
document.getElementById('fsNext').addEventListener('click', goNext);
document.getElementById('fsPrev').addEventListener('click', goPrev);
document.getElementById('mpFullscreen').addEventListener('click', goFullscreen);
document.getElementById('mpClose').addEventListener('click', () => {
  stopAllPlayers();
  playQueue = [];
  queueIndex = -1;
  currentState = null;
});
document.getElementById('fsClose').addEventListener('click', () => {
  stopAllPlayers();
  playQueue = [];
  queueIndex = -1;
  currentState = null;
});
document.getElementById('fsMinimize').addEventListener('click', goMini);

// --- Long-press-to-drag for the mini player ---
// A quick tap on the header does nothing (avoids accidental nudges); the
// player only starts following your finger/cursor after a ~350ms hold,
// signaled by the header lighting up and the hint text changing.
const LONG_PRESS_MS = 350;
const MOVE_CANCEL_THRESHOLD = 8;

let pressTimer = null;
let armed = false;
let dragOffsetX = 0, dragOffsetY = 0;
let startX = 0, startY = 0;

function clampToViewport() {
  const rect = miniPlayer.getBoundingClientRect();
  const maxX = window.innerWidth - rect.width;
  const maxY = window.innerHeight - rect.height;
  let x = Math.min(Math.max(rect.left, 0), Math.max(maxX, 0));
  let y = Math.min(Math.max(rect.top, 0), Math.max(maxY, 0));
  miniPlayer.style.left = x + 'px';
  miniPlayer.style.top = y + 'px';
  miniPlayer.style.right = 'auto';
  miniPlayer.style.bottom = 'auto';
}

// If the viewport changes (mobile browser chrome showing/hiding, rotation),
// re-clamp so the widget can never end up stranded off-screen.
window.addEventListener('resize', () => {
  if (miniPlayer.classList.contains('show')) clampToViewport();
});

mpHead.addEventListener('pointerdown', (e) => {
  armed = false;
  startX = e.clientX;
  startY = e.clientY;
  const rect = miniPlayer.getBoundingClientRect();
  dragOffsetX = e.clientX - rect.left;
  dragOffsetY = e.clientY - rect.top;
  mpHead.setPointerCapture(e.pointerId);

  pressTimer = setTimeout(() => {
    armed = true;
    mpHead.classList.add('armed');
    mpHint.textContent = '⠿ moving...';
  }, LONG_PRESS_MS);
});

mpHead.addEventListener('pointermove', (e) => {
  if (!armed) {
    // Cancel the long-press if the finger moves too much before it fires —
    // avoids accidentally arming drag on a slightly shaky tap.
    const dist = Math.hypot(e.clientX - startX, e.clientY - startY);
    if (dist > MOVE_CANCEL_THRESHOLD && pressTimer) {
      clearTimeout(pressTimer);
      pressTimer = null;
    }
    return;
  }
  let x = e.clientX - dragOffsetX;
  let y = e.clientY - dragOffsetY;
  const maxX = window.innerWidth - miniPlayer.offsetWidth;
  const maxY = window.innerHeight - miniPlayer.offsetHeight;
  x = Math.max(0, Math.min(x, maxX));
  y = Math.max(0, Math.min(y, maxY));
  miniPlayer.style.left = x + 'px';
  miniPlayer.style.top = y + 'px';
  miniPlayer.style.right = 'auto';
  miniPlayer.style.bottom = 'auto';
});

function endPress() {
  if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
  armed = false;
  mpHead.classList.remove('armed');
  mpHint.textContent = '⠿ hold to move';
}

mpHead.addEventListener('pointerup', endPress);
mpHead.addEventListener('pointercancel', endPress);

refreshGenres();
</script>
</body>
</html>
